name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: dbt snapshot
        working-directory: banking_dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CD_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_CD_PASSWORD }}
          SNOWFLAKE_ROLE: banking_cd_role
        run: dbt snapshot

      - name: dbt run
        working-directory: banking_dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CD_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_CD_PASSWORD }}
          SNOWFLAKE_ROLE: banking_cd_role
        run: dbt run

      - name: dbt test
        working-directory: banking_dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CD_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_CD_PASSWORD }}
          SNOWFLAKE_ROLE: banking_cd_role
        run: dbt test